<!-- Big Minds Dashboard v1.1 (Upgraded by Jackson) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Minds Dashboard</title>

<style>
body {
  margin:0;
  font-family: system-ui;
  background:#06060e;
  color:#eee;
}

.container {
  max-width:420px;
  margin:auto;
  padding:12px;
}

.card {
  background:rgba(255,255,255,0.05);
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  backdrop-filter:blur(10px);
}

.title { font-weight:700; font-size:14px; margin-bottom:6px; }
.big { font-size:28px; font-weight:800; }

.btn {
  padding:6px 10px;
  border-radius:8px;
  border:none;
  background:#18d8f0;
  color:#000;
  font-weight:600;
}

.row { display:flex; justify-content:space-between; align-items:center; }
.small { font-size:11px; opacity:.6; }

</style>
</head>

<body>
<div class="container">

<!-- GREETING -->
<div class="card">
  <div class="title">Welcome</div>
  <div id="greeting">Loading...</div>
  <button class="btn" onclick="setLocation()">Set Location</button>
</div>

<!-- WEATHER + CLOCK -->
<div class="card">
  <div class="row">
    <div>
      <div class="big" id="temp">--°</div>
      <div id="city">No location</div>
    </div>
    <div>
      <div class="big" id="time">--:--</div>
      <div class="small" id="date"></div>
    </div>
  </div>
</div>

<!-- PRAYER -->
<div class="card">
  <div class="title">Next Prayer</div>
  <div id="nextPrayer">--</div>
  <div id="countdown" class="big">--:--:--</div>
</div>

<!-- STATS -->
<div class="card">
  <div class="row">
    <div>
      <div class="big" id="mail">--</div>
      <div class="small">Unread Mail</div>
    </div>
    <div>
      <div class="big" id="events">--</div>
      <div class="small">Events Today</div>
    </div>
  </div>
</div>

<!-- QUOTE -->
<div class="card" onclick="newQuote()">
  <div id="quote">Tap for quote</div>
</div>

<!-- FOREX -->
<div class="card">
  <div class="title">Markets</div>
  <div>EUR/USD: <span id="eur">--</span></div>
  <div>Gold: <span id="gold">--</span></div>
  <div>Silver: <span id="silver">--</span></div>
</div>

<!-- NUKE -->
<button class="btn" style="width:100%;background:#f04060;color:#fff" onclick="nuke()">Clear Data</button>

</div>

<script>
let state = {
  location: JSON.parse(localStorage.getItem("loc") || "null")
};

function save() {
  localStorage.setItem("loc", JSON.stringify(state.location));
}

function setLocation() {
  navigator.geolocation.getCurrentPosition(pos=>{
    state.location = {
      lat: pos.coords.latitude,
      lon: pos.coords.longitude
    };
    save();
    init();
  });
}

function updateTime() {
  const now = new Date();
  document.getElementById("time").innerText =
    now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

  document.getElementById("date").innerText =
    now.toDateString();
}
setInterval(updateTime,1000);

async function loadWeather() {
  if(!state.location) return;

  const {lat, lon} = state.location;

  const r = await fetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`
  );
  const d = await r.json();

  document.getElementById("temp").innerText =
    Math.round(d.current_weather.temperature)+"°";
}

async function loadForex() {
  const r = await fetch("https://api.frankfurter.app/latest?from=EUR&to=USD");
  const d = await r.json();

  document.getElementById("eur").innerText =
    d.rates.USD.toFixed(2);
}

function newQuote() {
  const quotes = [
    "Stay hungry, stay foolish",
    "Do what matters",
    "Consistency beats motivation"
  ];
  document.getElementById("quote").innerText =
    quotes[Math.floor(Math.random()*quotes.length)];
}

function nuke() {
  localStorage.clear();
  location.reload();
}

function init() {
  updateTime();
  loadWeather();
  loadForex();
  newQuote();
}

init();
</script>
</body>
</html>
