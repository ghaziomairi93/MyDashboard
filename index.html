<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard v1.4</title>

<style>
:root{
--bg:#0c0f14;
--card:rgba(255,255,255,0.05);
--border:rgba(255,255,255,0.08);
--accent:#00ff9c;
}

body{
margin:0;
font-family:-apple-system,system-ui;
background:linear-gradient(135deg,#0c0f14,#141b25);
color:#e8e8e8;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:14px;
padding:14px;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:16px;
padding:16px;
backdrop-filter:blur(12px);
}

.title{margin-bottom:10px;opacity:0.8;font-weight:600;}
.value{color:var(--accent);font-weight:600;}

ul{list-style:none;padding:0;margin:0;}
li{display:flex;justify-content:space-between;padding:6px 0;}

button{
width:100%;
margin-top:10px;
padding:10px;
border:none;
border-radius:10px;
background:rgba(255,255,255,0.1);
color:white;
}
</style>
</head>

<body>

<div class="dashboard">

<div class="card">
<div class="title">Weather & Time</div>
<div id="weather">--</div>
<div id="clock" class="value">--</div>
<button onclick="changeLocation()">Change Location</button>
</div>

<div class="card">
<div class="title">Prayer Times</div>
<ul id="prayers"></ul>
</div>

<div class="card">
<div class="title">Next Prayer</div>
<div id="nextPrayer" class="value">--</div>
</div>

<div class="card">
<div class="title">Crypto</div>
<ul id="crypto"></ul>
</div>

<div class="card">
<div class="title">Forex & Metals</div>
<ul id="forex"></ul>
</div>

<div class="card">
<div class="title">Tasks</div>
<ul id="tasks"></ul>
<button onclick="addTask()">Add Task</button>
</div>

<div class="card">
<div class="title">Event Countdown</div>
<div id="eventCountdown">No event</div>
<button onclick="setEvent()" id="eventBtn">＋ Create Event</button>
</div>

<div class="card" onclick="newQuote()">
<div class="title">Quote</div>
<div id="quote">Tap to change quote</div>
</div>

<div class="card">
<div class="title">News</div>
<ul id="news"></ul>
</div>

<div class="card">
<div class="title">Support</div>
<input id="email" placeholder="Email (optional)">
<textarea id="msg" placeholder="Message"></textarea>
<button onclick="sendSupport()">Send</button>
</div>

<div class="card">
<div class="title">System</div>
<button onclick="nuke()">NUKE</button>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/adhan@4.0.0/dist/Adhan.min.js"></script>

<script>

// STATE
let state = JSON.parse(localStorage.getItem("state")) || {
lat:48.78, lon:11.43, timezone:"UTC"
};

// SAVE
function save(){ localStorage.setItem("state",JSON.stringify(state)); }

// CLOCK
setInterval(()=>{
document.getElementById("clock").innerText =
new Date().toLocaleTimeString("en-US",{timeZone:state.timezone});
},1000);

// LOCATION
async function changeLocation(){
const city=prompt("City");
const d=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${city}`).then(r=>r.json());
state.lat=d[0].lat; state.lon=d[0].lon;

const tz=await fetch(`https://api.bigdatacloud.net/data/timezone-by-location?latitude=${state.lat}&longitude=${state.lon}`).then(r=>r.json());
state.timezone=tz.timeZoneId;

save(); init();
}

// WEATHER
async function weather(){
const d=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${state.lat}&longitude=${state.lon}&current_weather=true`).then(r=>r.json());
document.getElementById("weather").innerText=d.current_weather.temperature+"°C";
}

// PRAYER
let pt;
function prayers(){
const params=adhan.CalculationMethod.MuslimWorldLeague();
pt=new adhan.PrayerTimes({latitude:state.lat,longitude:state.lon},new Date(),params);

document.getElementById("prayers").innerHTML=["fajr","dhuhr","asr","maghrib","isha"]
.map(p=>{
const t=pt[p];
return `<li>${p.toUpperCase()} <span class="value">${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}</span></li>`;
}).join("");
}

// NEXT PRAYER
setInterval(()=>{
if(!pt) return;
const now=new Date();
for(let p of ["fajr","dhuhr","asr","maghrib","isha"]){
if(pt[p]>now){
const diff=pt[p]-now;
const h=Math.floor(diff/3600000);
const m=Math.floor((diff%3600000)/60000);
document.getElementById("nextPrayer").innerText=`Next: ${p.toUpperCase()} · ${h}h ${m}m`;
break;
}
}
},1000);

// CRYPTO
async function crypto(){
const d=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,helium,ripple&vs_currencies=usd').then(r=>r.json());
document.getElementById("crypto").innerHTML=Object.entries(d)
.map(([k,v])=>`<li>${k.toUpperCase()} <span class="value">$${v.usd}</span></li>`).join("");
}

// FOREX
async function forex(){
const fx=await fetch('https://api.frankfurter.app/latest?from=USD&to=EUR').then(r=>r.json());
document.getElementById("forex").innerHTML=`<li>EUR/USD <span class="value">${fx.rates.EUR}</span></li>`;
}

// TASKS
function addTask(){
const t=prompt("Task");
if(!t) return;
let tasks=JSON.parse(localStorage.getItem("tasks")||"[]");
tasks.push(t);
localStorage.setItem("tasks",JSON.stringify(tasks));
loadTasks();
}
function loadTasks(){
let tasks=JSON.parse(localStorage.getItem("tasks")||"[]");
document.getElementById("tasks").innerHTML=tasks.map(t=>`<li>${t}</li>`).join("");
}

// EVENT
function setEvent(){
const val=prompt("YYYY-MM-DD HH:MM");
if(val) localStorage.setItem("event",val);
}
setInterval(()=>{
const e=localStorage.getItem("event");
if(!e){ document.getElementById("eventCountdown").innerText="No event"; return;}
const diff=new Date(e)-new Date();
const h=Math.floor(diff/3600000);
const m=Math.floor((diff%3600000)/60000);
document.getElementById("eventCountdown").innerText=`in ${h}h ${m}m`;
},1000);

// QUOTE
function newQuote(){
fetch('https://api.quotable.io/random').then(r=>r.json())
.then(d=>document.getElementById("quote").innerText=d.content);
}

// NEWS
async function news(){
const d=await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://feeds.bbci.co.uk/news/rss.xml').then(r=>r.json());
document.getElementById("news").innerHTML=d.items.slice(0,5)
.map(n=>`<li>${n.title}</li>`).join("");
}

// SUPPORT
function sendSupport(){
fetch('https://api.web3forms.com/submit',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
access_key:'53bad208-02b2-40b6-974b-98f8b68d0439',
email:document.getElementById("email").value,
message:document.getElementById("msg").value
})
});
alert("Sent");
}

// NUKE
function nuke(){
localStorage.clear();
location.reload();
}

// INIT
function init(){
weather();
prayers();
crypto();
forex();
news();
loadTasks();
}

init();
setInterval(()=>{crypto(); forex();},30000);

</script>

</body>
</html>
