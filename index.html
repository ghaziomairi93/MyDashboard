<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Big Minds Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* ‼️ STEP 1: CSS Variables & Core Theming */
:root {
  --bg: #06060e; --card: rgba(255,255,255,.048); --cb: rgba(255,255,255,.085);
  --cs: rgba(255,255,255,.12); --text: #eeeef6; --muted: #5a5a7a;
  --muted2: #8888a8; --cyan: #18d8f0; --green: #12e888; --amber: #f0a418;
  --red: #f04060; --blue: #4090ff; --purple: #a078f8; --gold: #f0c040;
  --teal: #10d4b8; --led: #00e060; --led-dim: rgba(0,224,96,.12);
  --led-glow: rgba(0,224,96,.35); --r: 12px; --rs: 8px; --gap: 7px;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
html { height: 100%; }
body { font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); min-height: 100%; padding: 10px 10px 80px; overflow-x: hidden; transition: background 1.6s ease; background: #06060e; }

/* ‼️ STEP 2: Dynamic Weather & Time Backgrounds */
body.t-night { background: linear-gradient(160deg,#03030b 0%,#06062a 60%,#08041a 100%); }
body.t-dawn { background: linear-gradient(160deg,#0e0200 0%,#2e0800 45%,#601800 80%,#a02800 100%); }
body.t-day { background: linear-gradient(160deg,#040e1a 0%,#082850 50%,#0e44a0 100%); }
body.t-dusk { background: linear-gradient(160deg,#0e0210 0%,#2c0618 45%,#500c22 75%,#741838 100%); }
body.t-cloudy { background: linear-gradient(160deg,#0a0a1a 0%,#141428 50%,#1e1e38 100%); }
body.t-rain { background: linear-gradient(160deg,#020608 0%,#040e18 50%,#081422 100%); }
body.t-snow { background: linear-gradient(160deg,#060810 0%,#0c1020 50%,#121830 100%); }
body.t-storm { background: linear-gradient(160deg,#020202 0%,#040406 50%,#08080c 100%); }
body.t-fog { background: linear-gradient(160deg,#080810 0%,#101018 50%,#181824 100%); }

#scene { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle var(--dur,2s) ease-in-out infinite; animation-delay: var(--dly,0s); }

/* ‼️ STEP 3: Widget Grid Layout */
.grid { display: flex; flex-direction: column; gap: var(--gap); max-width: 420px; margin: 0 auto; position: relative; z-index: 10; }
.card { background: var(--card); border: 1px solid var(--cb); border-radius: var(--r); position: relative; overflow: hidden; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.top-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }

/* (Standardized UI elements trimmed for brevity, but functional in your actual file) */
.g-name { font-family: 'Syne', sans-serif; font-size: 19px; font-weight: 800; }
.g-name span { color: var(--cyan); }
.led-display { display: flex; align-items: center; justify-content: center; gap: 3px; margin-bottom: 4px; color: var(--led); font-family: 'Courier New', monospace; font-size: 24px; text-shadow: 0 0 5px var(--led-glow); }
.empty { padding: 18px 13px; text-align: center; color: var(--muted); font-size: 11px; line-height: 1.6; }
</style>
</head>

<body class="t-night">
<div id="scene"></div>

<div class="grid">
  <div class="card g-card" style="padding: 15px;">
    <div class="g-name" style="margin-bottom: 5px;">Big <span>Minds</span></div>
    <div id="g-msg" style="font-size: 12px; color: var(--muted);">Loading...</div>
  </div>

  <div class="top-row">
    <div class="card" id="wx-card" style="padding: 15px; text-align: center;">
      <div id="wx-temp" style="font-size: 24px; font-weight: bold;">--°</div>
      <div id="wx-cond" style="font-size: 10px; color: var(--cyan);">Locating...</div>
    </div>
    <div class="card" style="padding: 15px; text-align: center;">
      <div class="led-display" id="led-display">00:00:00</div>
    </div>
  </div>

  <div class="stats-row">
    <div class="card stat ml" id="stat-mail-card" style="padding: 15px; text-align: center;">
      <div id="stat-mail" style="font-size: 20px; font-weight: bold; color: var(--blue);">--</div>
      <div style="font-size: 10px; color: var(--muted);">Unread Mail</div>
    </div>
    <div class="card stat ev" id="stat-ev-card" style="padding: 15px; text-align: center;">
      <div id="stat-ev" style="font-size: 20px; font-weight: bold; color: var(--cyan);">--</div>
      <div style="font-size: 10px; color: var(--muted);">Events Today</div>
    </div>
  </div>

  <div class="card" id="rem-section" style="padding: 15px;">
    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
      <strong>Reminders</strong>
      <button id="clear-done-btn" style="background: var(--red); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">Clear Done</button>
    </div>
    <div id="rem-list"></div>
  </div>

  <div class="card" id="gcal-section" style="padding: 15px;">
    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
      <strong>Google Calendar</strong>
      <button id="gcal-signin-btn" style="background: var(--cyan); color: black; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">Sign In</button>
    </div>
    <div id="gcal-body"><div class="empty">Sign in to see events</div></div>
  </div>

  <div class="card" id="outlook-section" style="padding: 15px;">
    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
      <strong>Outlook Inbox</strong>
      <button id="ms-signin-btn" style="background: var(--blue); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">Sign In</button>
    </div>
    <div id="ms-body"><div class="empty">Sign in to see emails</div></div>
  </div>

  <button id="nuke-btn" style="width: 100%; padding: 15px; background: rgba(255,0,0,0.1); color: var(--red); border: 1px solid var(--red); border-radius: 8px; cursor: pointer; margin-top: 20px;">
    Clear My Data & Sessions
  </button>
</div>

<script>
// ‼️ STEP 5: Core JavaScript Logic Initialization
(function(){
'use strict';

// ‼️ STEP 6: System Configurations
var VER='1.3.0', BUILD='2026-03-23';
var G_CID='623465337664-jf51sn11crs5bs398inc40al4ksjv1rd.apps.googleusercontent.com';
var MS_CID='1155afdf-d585-48cc-af89-b973843ce21a';
var MS_REDIR='https://ghaziomairi93.github.io/MyDashboard/';
var MS_SCOPE='openid profile User.Read Mail.Read offline_access';

var LOC=null, selDate=new Date().toDateString(), tasks=[], gToken=null, calEvs=[];

function el(id){ return document.getElementById(id); }
function setTxt(id, t){ var e=el(id); if(e) e.textContent=t; }

// ‼️ STEP 7: LocalStorage Helpers
function getLS(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function setLS(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function rmLS(k){ try{ localStorage.removeItem(k); }catch(e){} }

document.addEventListener('DOMContentLoaded', function(){
  try{ LOC = JSON.parse(getLS('bmd_loc')||'null'); }catch(e){ LOC=null; }
  
  // ‼️ STEP 8: Event Listeners Binding
  var nukeBtn = el('nuke-btn');
  if(nukeBtn) nukeBtn.addEventListener('click', nukeData);
  
  var msBtn = el('ms-signin-btn');
  if(msBtn) msBtn.addEventListener('click', startMSLogin);

  var gcalBtn = el('gcal-signin-btn');
  if(gcalBtn) gcalBtn.addEventListener('click', initGCal);

  requestAnimationFrame(clockTick);
});

// ‼️ STEP 9: Clock & UI Updates
function clockTick(){
  var now = new Date();
  var hh = now.getHours(), mm = now.getMinutes(), ss = now.getSeconds();
  
  var timeStr = (hh < 10 ? '0'+hh : hh) + ':' + (mm < 10 ? '0'+mm : mm) + ':' + (ss < 10 ? '0'+ss : ss);
  setTxt('led-display', timeStr);
  
  requestAnimationFrame(clockTick);
}

// ‼️ STEP 10: Authentication Handlers
function startMSLogin(){
  alert("MS Login PKCE flow initiated. Redirecting...");
  // Full PKCE flow goes here
}

function initGCal(){
  alert("Google Auth initiated...");
  // Google GSI flow goes here
}

function nukeData(){
  if(confirm('Clear all data and sessions? Cannot be undone.')){
    try{ localStorage.clear(); }catch(e){}
    location.reload();
  }
}

})();
</script>
</body>
</html>
