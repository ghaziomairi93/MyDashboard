<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Big Minds Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --bg: #05050d;
  --card: rgba(30,30,70,0.16);
  --card-hover: rgba(50,50,100,0.24);
  --cb: rgba(140,160,255,0.20);
  --cs: rgba(180,190,255,0.14);
  --text: #f0f0ff;
  --muted: #707090;
  --muted2: #a0a0c8;
  --cyan: #20e0ff;
  --green: #18ffaa;
  --amber: #ffbc30;
  --red: #ff5068;
  --blue: #5098ff;
  --purple: #b080ff;
  --gold: #ffcc50;
  --teal: #18e0d0;
  --led: #00ff88;
  --led-dim: rgba(0,255,140,0.18);
  --led-glow: rgba(0,255,140,0.45);
  --r: 20px;
  --rs: 12px;
  --gap: 10px;
  --glass-blur: blur(24px);
  --glass-shine: linear-gradient(135deg, rgba(255,255,255,0.09) 0%, transparent 60%);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
html{height:100%;}
body{
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  color:var(--text);
  min-height:100%;
  padding:12px 12px 90px;
  overflow-x:hidden;
  transition:background 1.8s ease;
  background:var(--bg);
  position: relative;
}
body::after{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background: radial-gradient(circle at 50% 70%, transparent 30%, rgba(0,0,20,0.45) 100%);
}

/* ── THEMES ──────────────────────────────────────────────── */
body.t-night   {background:linear-gradient(155deg,#02020c 0%,#0a0a2e 55%,#120830 100%);}
body.t-dawn    {background:linear-gradient(155deg,#140300,#3a0c00 40%,#701c00 75%,#b03000);}
body.t-day     {background:linear-gradient(155deg,#041424,#0c3a70 45%,#1a5cc8 100%);}
body.t-dusk    {background:linear-gradient(155deg,#140218,#380620 40%,#600c28 75%,#8c2040);}
body.t-cloudy  {background:linear-gradient(155deg,#0c0c20,#1c1c38 50%,#282850);}
body.t-rain    {background:linear-gradient(155deg,#02080c,#061828 50%,#0a1e30);}
body.t-snow    {background:linear-gradient(155deg,#080c18,#101c30 50%,#182440);}
body.t-storm   {background:linear-gradient(155deg,#020204,#06060c 50%,#0c0c14);}
body.t-fog     {background:linear-gradient(155deg,#0a0a18,#121228 50%,#1c1c2c);}

#scene{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--dur,2.4s) ease-in-out infinite;animation-delay:var(--dly,0s);}
.moon{position:absolute;top:8%;right:10%;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 38% 38%,#fffce0,#f8d870 48%,#c0a030);box-shadow:0 0 24px rgba(255,220,80,0.35),0 0 60px rgba(255,200,60,0.12);animation:mfloat 8s ease-in-out infinite;}
.moon-c{position:absolute;border-radius:50%;background:rgba(0,0,0,0.11);}
.sun{position:absolute;top:9%;right:10%;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,#ffffa0,#ffd040 58%,#f09010);animation:spulse 3.6s ease-in-out infinite;}
.cloud{position:absolute;border-radius:80px;background:rgba(160,180,220,0.09);filter:blur(12px);}
.lflash{position:fixed;inset:0;pointer-events:none;background:rgba(140,140,255,0.14);animation:flash 6s ease-in-out infinite;z-index:3;}
.fog-b{position:absolute;left:-16%;right:-16%;height:56px;border-radius:50%;background:rgba(170,180,220,0.07);filter:blur(16px);animation:fogd 13s ease-in-out infinite alternate;}
.rdrop{
  position:absolute;
  width:1.6px;
  border-radius:2px;
  background:linear-gradient(to bottom,transparent,rgba(140,220,255,0.75));
  transform:rotate(18deg);
  animation:rfall linear infinite;
  top:-90px;
}
.snow{
  position:absolute;
  border-radius:50%;
  background:rgba(235,245,255,0.96);
  filter:blur(0.4px);
  box-shadow:0 0 8px rgba(220,240,255,0.7);
  animation:sfall linear infinite;
  top:-24px;
  transform-origin:center;
}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes twinkle{0%,100%{opacity:0.07}50%{opacity:0.9}}
@keyframes mfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes spulse{0%,100%{box-shadow:0 0 0 0 rgba(255,210,60,0.45)}50%{box-shadow:0 0 0 18px rgba(255,210,60,0)}}
@keyframes flash{0%,87%,100%{opacity:0}89%,91%{opacity:0.55}90%{opacity:0}}
@keyframes fogd{0%{transform:translateX(-8%)}100%{transform:translateX(8%)}}
@keyframes rfall{to{transform:translateY(120vh)}}
@keyframes sfall{to{transform:translateY(120vh) translateX(var(--drift,0)) rotate(900deg)}}

.grid{display:flex;flex-direction:column;gap:var(--gap);max-width:440px;margin:0 auto;position:relative;z-index:10;}
.grid>*{animation:fadeUp 0.4s ease both;}
.grid>*:nth-child(1){animation-delay:0.04s}
.grid>*:nth-child(2){animation-delay:0.09s}
.grid>*:nth-child(3){animation-delay:0.14s}
.grid>*:nth-child(4){animation-delay:0.19s}
.grid>*:nth-child(5){animation-delay:0.24s}
.grid>*:nth-child(6){animation-delay:0.29s}
.grid>*:nth-child(7){animation-delay:0.34s}
.grid>*:nth-child(8){animation-delay:0.39s}
.grid>*:nth-child(9){animation-delay:0.44s}
.grid>*:nth-child(10){animation-delay:0.49s}
.grid>*:nth-child(11){animation-delay:0.54s}
.grid>*:nth-child(12){animation-delay:0.59s}
.grid>*:nth-child(13){animation-delay:0.64s}
.grid>*:nth-child(14){animation-delay:0.69s}
.grid>*:nth-child(15){animation-delay:0.74s}

.card{
  background:var(--card);
  border:1px solid var(--cb);
  border-radius:var(--r);
  position:relative;
  overflow:hidden;
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  box-shadow:0 10px 40px rgba(0,0,0,0.38),
             inset 0 1px 1px rgba(255,255,255,0.06);
  transition: all 0.32s cubic-bezier(0.34,1.56,0.64,1);
  transform: translateY(0) scale(1);
}
.card:hover{
  transform: translateY(-6px) scale(1.014);
  box-shadow:0 24px 60px rgba(0,0,0,0.48),
             inset 0 1px 2px rgba(255,255,255,0.10);
  background:var(--card-hover);
}
.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--glass-shine);
  pointer-events:none;
  opacity:0.7;
  mix-blend-mode:screen;
  z-index:0;
}
.card>*{position:relative;z-index:1;}

.g-card{
  border-color:rgba(32,220,255,0.22);
  background:linear-gradient(145deg,rgba(32,220,255,0.08),rgba(80,160,255,0.04));
}
.g-eye{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:3px;margin-bottom:4px;}
.g-name{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;line-height:1;letter-spacing:-0.5px;text-shadow:0 3px 14px rgba(32,220,255,0.45);}
.g-name span{color:var(--cyan);}
.g-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:10px;}
.g-sub{font-size:12px;color:var(--muted2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.loc-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(32,220,255,0.14);
  color:var(--cyan);
  border:1px solid rgba(32,220,255,0.28);
  border-radius:24px;
  padding:5px 12px;
  font-size:11px;font-weight:700;cursor:pointer;
  white-space:nowrap;flex-shrink:0;
  transition: all 0.22s ease;
}
.loc-btn:hover{transform:scale(1.06);background:rgba(32,220,255,0.22);}

.wx-card{
  cursor:pointer;
  border-color:rgba(32,220,255,0.18);
  background:linear-gradient(145deg,rgba(32,220,255,0.08),transparent 65%);
}
.wx-temp{font-family:'Syne',sans-serif;font-size:42px;font-weight:800;line-height:1;letter-spacing:-2px;text-shadow:0 6px 20px rgba(0,0,0,0.7),0 0 16px var(--cyan);}
.wx-ico{font-size:26px;line-height:1;margin-top:4px;}
.wx-cond{font-size:11px;color:var(--cyan);font-weight:700;margin-top:4px;}
.wx-city{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.8px;font-weight:600;margin-top:6px;}

.clk-card{
  border-color:rgba(0,255,140,0.28);
  background:linear-gradient(145deg,rgba(0,255,140,0.06),transparent 65%);
  position:relative;
}
.led-display{
  display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:6px;
  filter: drop-shadow(0 0 20px rgba(0,255,140,0.6));
  padding:14px 0;
  border-radius:16px;
  background:rgba(0,0,0,0.45);
}
.led-digit{display:grid;grid-template-areas:"tl t tr" "ml . mr" "bl b br";grid-template-columns:7px 3px 7px;grid-template-rows:7px 3px 7px;gap:1.5px;}
.seg{border-radius:1.5px;}
.seg.h{height:4px;width:100%;}
.seg.v{width:4px;height:100%;}
.seg.on{background:var(--led);box-shadow:0 0 6px var(--led-glow),0 0 12px var(--led-glow);}
.seg.off{background:var(--led-dim);}
.led-colon{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;padding:0 2px;}
.led-dot{width:4px;height:4px;border-radius:50%;background:var(--led);box-shadow:0 0 6px var(--led-glow);animation:ledblink 1.1s ease-in-out infinite;}

.stat{
  text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:88px;cursor:pointer;
  transition: all 0.32s cubic-bezier(0.34,1.56,0.64,1);
}
.stat:hover{transform:translateY(-8px) scale(1.018);}
.stat-n{font-family:'Syne',sans-serif;font-size:34px;font-weight:800;line-height:1;letter-spacing:-1.5px;text-shadow:0 6px 20px rgba(0,0,0,0.65);}
.stat.ml .stat-n{color:var(--blue);text-shadow:0 0 18px rgba(80,160,255,0.6);}
.stat.ev .stat-n{color:var(--cyan);text-shadow:0 0 18px rgba(32,220,255,0.6);}

.tk-n{font-family:'Syne',sans-serif;font-size:52px;font-weight:800;color:var(--green);line-height:1;letter-spacing:-3px;text-shadow:0 8px 28px rgba(24,255,160,0.35);}

.cd-hms{font-family:'Space Mono',monospace;font-size:22px;color:var(--amber);text-shadow:0 0 12px rgba(255,180,60,0.5);letter-spacing:2px;}

.cd-name{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--amber);}

</style>
</head>
