
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard v1.0.2</title>

<style>
:root {
    --bg:#0f1115;
    --card:rgba(255,255,255,0.05);
    --accent:#00ff9c;
}

body{
    margin:0;
    background:linear-gradient(135deg,#0f1115,#1a1d23);
    color:white;
    font-family:system-ui;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:15px;
    padding:15px;
}

.card{
    background:var(--card);
    backdrop-filter:blur(12px);
    border-radius:18px;
    padding:18px;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.title{
    font-size:1.2em;
    margin-bottom:10px;
    display:flex;
    align-items:center;
}

.value{
    color:var(--accent);
    font-size:1.3em;
}

ul{
    list-style:none;
    padding:0;
    margin:0;
}

button{
    margin-top:10px;
    padding:10px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.1);
    color:white;
}
</style>
</head>

<body>

<div class="dashboard">

<!-- Weather + Clock -->
<div class="card">
<div class="title">Weather & Clock</div>
<div id="weather">--</div>
<div id="clock" class="value">--:--</div>
<button onclick="changeLocation()">Change Location</button>
</div>

<!-- Prayer Times -->
<div class="card">
<div class="title">Prayer Times</div>
<ul id="prayers"></ul>
</div>

<!-- Next Prayer -->
<div class="card">
<div class="title">Next Prayer</div>
<div id="nextPrayer" class="value">--</div>
</div>

<!-- Crypto -->
<div class="card">
<div class="title">Crypto</div>
<ul id="crypto"></ul>
<button onclick="loadCrypto()">Refresh</button>
</div>

<!-- Forex -->
<div class="card">
<div class="title">Forex & Metals</div>
<ul id="forex"></ul>
<button onclick="loadForex()">Refresh</button>
</div>

<!-- Event Countdown -->
<div class="card">
<div class="title">Event Countdown</div>
<div id="eventCountdown">No event</div>
<button onclick="setEvent()" id="eventBtn">＋ Create Event</button>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/adhan@4.0.0/dist/Adhan.min.js"></script>

<script>

// LOCATION
let lat=48.78, lon=11.43;

function changeLocation(){
    const city = prompt("Enter city");
    fetch(`/api/geocode?city=${city}`)
    .then(r=>r.json())
    .then(d=>{
        lat=d.lat; lon=d.lon;
        loadAll();
    });
}

// CLOCK
function updateClock(){
    document.getElementById("clock").innerText = new Date().toLocaleTimeString();
}
setInterval(updateClock,1000);

// WEATHER
function loadWeather(){
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
    .then(r=>r.json())
    .then(d=>{
        document.getElementById("weather").innerText = d.current_weather.temperature+"°C";
    });
}

// PRAYERS
let prayerTimes;
function loadPrayers(){
    const params = adhan.CalculationMethod.MuslimWorldLeague();
    prayerTimes = new adhan.PrayerTimes({latitude:lat,longitude:lon}, new Date(), params);

    const list=["fajr","dhuhr","asr","maghrib","isha"];
    document.getElementById("prayers").innerHTML = list.map(p=>{
        const t=prayerTimes[p];
        return `<li>${p.toUpperCase()}: <span class="value">${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}</span></li>`;
    }).join("");

    updateNextPrayer();
}

function updateNextPrayer(){
    const now=new Date();
    const order=["fajr","dhuhr","asr","maghrib","isha"];
    for(let p of order){
        if(prayerTimes[p]>now){
            const diff=prayerTimes[p]-now;
            const h=Math.floor(diff/3600000);
            const m=Math.floor((diff%3600000)/60000);
            document.getElementById("nextPrayer").innerText=`Next: ${p.toUpperCase()} · in ${h}h ${m}m`;
            break;
        }
    }
}

// CRYPTO
function loadCrypto(){
    fetch('/api/crypto')
    .then(r=>r.json())
    .then(d=>{
        const coins={
            BTC:d.bitcoin.usd,
            ETH:d.ethereum.usd,
            SOL:d.solana.usd,
            HNT:d.helium.usd,
            TRUMP:d['trumpcoin']?.usd || 'N/A',
            XRP:d['ripple']?.usd || 'N/A'
        };
        document.getElementById("crypto").innerHTML =
            Object.entries(coins).map(([k,v])=>`<li>${k}: <span class="value">$${v}</span></li>`).join("");
    });
}
setInterval(loadCrypto,30000);

// FOREX
function loadForex(){
    Promise.all([
        fetch('/api/forex').then(r=>r.json()),
        fetch('https://metals-api.com/api/latest?access_key=demo&base=USD&symbols=XAU,XAG').then(r=>r.json())
    ]).then(([fx,metals])=>{
        const eur=fx.rates.EUR;
        const gold=(metals.rates.XAU*1000).toFixed(2);
        const silver=(metals.rates.XAG*1000).toFixed(2);

        document.getElementById("forex").innerHTML=`
            <li>EUR/USD: <span class="value">${eur}</span></li>
            <li>Gold/g: <span class="value">${gold}</span></li>
            <li>Silver/g: <span class="value">${silver}</span></li>
        `;
    });
}
setInterval(loadForex,30000);

// EVENT
function setEvent(){
    const val=prompt("Enter date (YYYY-MM-DD HH:MM)");
    if(!val)return;
    localStorage.setItem("event",val);
    updateEvent();
}

function updateEvent(){
    const e=localStorage.getItem("event");
    const btn=document.getElementById("eventBtn");

    if(!e){
        document.getElementById("eventCountdown").innerText="No event";
        btn.innerText="＋ Create Event";
        return;
    }

    btn.innerText="Change Event";

    const diff=new Date(e)-new Date();
    const h=Math.floor(diff/3600000);
    const m=Math.floor((diff%3600000)/60000);

    document.getElementById("eventCountdown").innerText=`in ${h}h ${m}m`;
}
setInterval(updateEvent,1000);

// INIT
function loadAll(){
    loadWeather();
    loadPrayers();
    loadCrypto();
    loadForex();
    updateEvent();
}

loadAll();

</script>

</body>
</html>
