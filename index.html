<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Big Minds OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ‼️ SVG ICON LIBRARY (Hidden) -->
    <svg style="display:none;">
        <symbol id="icon-weather" viewBox="0 0 24 24"><path d="M12 7V3m0 18v-4m5.25-11.25L20 4.5M4 19.5l2.75-2.75m0-9.5L4 4.5M20 19.5l-2.75-2.75M17 12h4M3 12h4m5 5a5 5 0 100-10 5 5 0 000 10z"/></symbol>
        <!-- Add 50+ symbols here to reach GitHub scale -->
    </svg>

    <div class="app-shell">
        <!-- ‼️ DYNAMIC GREETING -->
        <header class="main-header">
            <h1 id="greeting">Good Evening</h1>
            <div class="system-stats">
                <span id="version-pill">v1.3.0-STABLE</span>
                <span id="uptime-display">UP: 04:22:10</span>
            </div>
        </header>

        <div class="main-grid">
            <!-- ‼️ LEFT COLUMN: FUNCTIONAL -->
            <div class="col-left">
                <div class="widget clock-hero">
                    <div id="hms-ticker" class="led-display">19:37:42</div>
                    <div id="date-string">Sunday, March 22</div>
                </div>
                
                <div class="widget weather-details">
                    <div class="weather-row">
                        <svg class="icon"><use href="#icon-weather"/></svg>
                        <span id="main-temp">21°C</span>
                    </div>
                    <div id="weather-subtext">Clear sky • Ingolstadt</div>
                </div>
            </div>

            <!-- ‼️ RIGHT COLUMN: INTERACTIVE -->
            <div class="col-right">
                <div class="widget task-manager">
                    <h3>Critical Tasks</h3>
                    <div id="task-container"></div>
                    <div class="task-controls">
                        <input type="text" id="task-input" placeholder="Type and press Enter...">
                    </div>
                </div>

                <div class="widget calendar-preview">
                    <div id="google-status" class="status-indicator">● Google Disconnected</div>
                    <div id="outlook-status" class="status-indicator">● Outlook Disconnected</div>
                </div>
            </div>
        </div>

        <!-- ‼️ FULL-SCREEN MODALS (The "Hidden" Code) -->
        <div id="modal-overlay" class="hidden">
            <div class="modal-content">
                <h2 id="modal-title">Settings</h2>
                <div id="modal-body">
                    <!-- ‼️ Logic: Forms for API Keys & Locations -->
                </div>
                <button onclick="closeModal()">CLOSE</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
