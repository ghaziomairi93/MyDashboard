<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>News Dashboard</title>
  <style>
    :root{
      --bg:#06060e;
      --card:rgba(255,255,255,.045);
      --border:rgba(255,255,255,.09);
      --text:#eeeef6;
      --muted:#8b8ba8;
      --muted2:#5a5a7a;
      --cyan:#18d8f0;
      --green:#4aed88;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial, Helvetica, sans-serif;
      background:linear-gradient(160deg,#03030b 0%,#06062a 60%,#08041a 100%);
      color:var(--text);
      min-height:100vh;
      padding:24px;
    }

    .wrap{
      max-width:760px;
      margin:0 auto;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      overflow:hidden;
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      box-shadow:0 10px 30px rgba(0,0,0,.25);
    }

    .head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:16px 18px;
      border-bottom:1px solid rgba(255,255,255,.07);
    }

    .title{
      font-size:18px;
      font-weight:700;
      letter-spacing:.2px;
    }

    .sub{
      margin-top:4px;
      font-size:12px;
      color:var(--muted);
      line-height:1.5;
    }

    .btn{
      border:1px solid rgba(24,216,240,.28);
      background:rgba(24,216,240,.12);
      color:var(--cyan);
      padding:9px 14px;
      border-radius:10px;
      cursor:pointer;
      font-size:13px;
      font-weight:700;
    }

    .btn:hover{
      filter:brightness(1.08);
    }

    #news-list{
      display:block;
    }

    .news-group + .news-group{
      border-top:1px solid rgba(255,255,255,.07);
    }

    .news-group-title{
      padding:14px 18px 8px;
      font-size:11px;
      color:var(--cyan);
      text-transform:uppercase;
      letter-spacing:1.5px;
      font-weight:700;
    }

    .ni{
      display:block;
      text-decoration:none;
      color:inherit;
      padding:14px 18px;
      border-top:1px solid rgba(255,255,255,.05);
      transition:background .18s ease;
    }

    .ni:hover{
      background:rgba(255,255,255,.03);
    }

    .nt{
      font-size:15px;
      font-weight:600;
      line-height:1.45;
      color:var(--text);
    }

    .nm{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
    }

    .empty{
      padding:24px 18px;
      text-align:center;
      color:var(--muted2);
      font-size:14px;
      line-height:1.6;
    }

    .foot{
      padding:12px 18px 16px;
      border-top:1px solid rgba(255,255,255,.05);
      font-size:12px;
      color:var(--muted2);
    }

    .ok{
      color:var(--green);
      font-weight:700;
    }

    @media (max-width:640px){
      body{
        padding:14px;
      }

      .head{
        align-items:flex-start;
        flex-direction:column;
      }

      .btn{
        width:100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <div>
          <div class="title">News Dashboard</div>
          <div class="sub">Top 3 automotive and top 2 Middle East political headlines — tap to open the source article</div>
        </div>
        <button class="btn" id="refresh-btn">↻ Refresh</button>
      </div>

      <div id="news-list">
        <div class="empty">Loading…</div>
      </div>

      <div class="foot" id="news-status">Status: <span class="ok">Ready</span></div>
    </div>
  </div>

  <script>
    function el(id){
      return document.getElementById(id);
    }

    function loadNews(){
      var e = el('news-list');
      var status = el('news-status');
      if(!e) return;

      var AUTO_RSS =
        'https://news.google.com/rss/search?q=' +
        encodeURIComponent('automotive OR "auto industry" OR EV OR carmaker when:7d') +
        '&hl=en-US&gl=US&ceid=US:en';

      var ME_RSS =
        'https://news.google.com/rss/search?q=' +
        encodeURIComponent('"Middle East" politics OR Israel OR Iran OR "Saudi Arabia" OR Lebanon OR Syria OR Jordan OR Qatar OR UAE when:7d') +
        '&hl=en-US&gl=US&ceid=US:en';

      e.innerHTML = '<div class="empty">Loading…</div>';
      if(status){
        status.innerHTML = 'Status: <span class="ok">Refreshing…</span>';
      }

      function rss2jsonUrl(rssUrl,count){
        return 'https://api.rss2json.com/v1/api.json?rss_url=' +
          encodeURIComponent(rssUrl) +
          '&count=' + count;
      }

      function esc(s){
        return String(s || '')
          .replace(/&/g,'&amp;')
          .replace(/</g,'&lt;')
          .replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;')
          .replace(/'/g,'&#39;');
      }

      function fmtDate(v){
        if(!v) return '';
        var d = new Date(v);
        if(isNaN(d.getTime())) return '';
        return d.toLocaleDateString('en-US', {
          month:'short',
          day:'numeric'
        });
      }

      function sourceName(item,fallback){
        if(item.author) return item.author;
        if(item.source_id) return item.source_id;

        var desc = item.description || '';
        var m = desc.match(/<font[^>]*>([^<]+)<\/font>/i);
        if(m && m[1]) return m[1];

        return fallback;
      }

      function cleanItems(items,limit,fallback){
        var seen = {};

        return (items || [])
          .filter(function(item){
            var t = (item.title || '').trim();
            if(!t) return false;

            var key = t.toLowerCase();
            if(seen[key]) return false;
            seen[key] = true;
            return true;
          })
          .slice(0,limit)
          .map(function(item){
            return {
              title:item.title || 'Untitled',
              link:item.link || '#',
              source:sourceName(item,fallback),
              date:fmtDate(item.pubDate)
            };
          });
      }

      function renderGroup(title,items){
        if(!items.length){
          return (
            '<div class="news-group">' +
              '<div class="news-group-title">' + esc(title) + '</div>' +
              '<div class="empty">No headlines available</div>' +
            '</div>'
          );
        }

        return (
          '<div class="news-group">' +
            '<div class="news-group-title">' + esc(title) + '</div>' +
            items.map(function(item){
              return (
                '<a class="ni" href="' + esc(item.link) + '" target="_blank" rel="noopener noreferrer">' +
                  '<div class="nt">' + esc(item.title) + '</div>' +
                  '<div class="nm">' + esc(item.source) + (item.date ? ' · ' + esc(item.date) : '') + '</div>' +
                '</a>'
              );
            }).join('') +
          '</div>'
        );
      }

      Promise.all([
        fetch(rss2jsonUrl(AUTO_RSS,8)).then(function(r){ return r.json(); }),
        fetch(rss2jsonUrl(ME_RSS,6)).then(function(r){ return r.json(); })
      ])
      .then(function(results){
        var autoItems = cleanItems(results[0] && results[0].items, 3, 'Automotive');
        var meItems = cleanItems(results[1] && results[1].items, 2, 'Middle East Politics');

        if(!autoItems.length && !meItems.length){
          e.innerHTML = '<div class="empty">No headlines available</div>';
          if(status){
            status.textContent = 'Status: No headlines available';
          }
          return;
        }

        e.innerHTML =
          renderGroup('Top Automotive News', autoItems) +
          renderGroup('Top Middle East Political News', meItems);

        if(status){
          status.textContent = 'Status: Updated ' + new Date().toLocaleTimeString([], {
            hour:'2-digit',
            minute:'2-digit'
          });
        }
      })
      .catch(function(){
        e.innerHTML = '<div class="empty">Could not load news</div>';
        if(status){
          status.textContent = 'Status: Could not load news';
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function(){
      var btn = el('refresh-btn');
      if(btn){
        btn.addEventListener('click', loadNews);
      }
      loadNews();
    });
  </script>
</body>
</html>
