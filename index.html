<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Big Minds Dashboard v1.3</title>
    <link rel="stylesheet" href="style.css"> <!-- Ensure your CSS file is named style.css -->
</head>
<body>

    <div class="dashboard-wrapper">
        <header class="main-header">
            <p class="welcome-text">WELCOME TO</p>
            <h1 class="brand-title">Big Minds Dashboard</h1>
        </header>

        <div class="dashboard-grid">
            <!-- ‼️ STEP 1: Weather Widget (Matches Screenshot) -->
            <div class="widget weather-widget">
                <p class="label">CURRENT</p>
                <div class="temp-big">8°</div>
                <div class="weather-city">INGOLSTADT</div>
            </div>

            <!-- ‼️ STEP 2: Precision LED Clock -->
            <div class="widget clock-widget">
                <div class="clock-display">
                    <span id="clock-main">00:00:00</span>
                    <span id="clock-ms" class="ms-glow">00</span>
                </div>
                <div id="clock-date" class="date-display">MAR 22 - GMT+1</div>
            </div>

            <!-- ‼️ STEP 3: Mail & Events Today -->
            <div class="widget mail-widget">
                <div class="stat-value">757</div>
                <p class="label">UNREAD MAIL</p>
            </div>

            <div class="widget events-widget">
                <div class="stat-value">2</div>
                <p class="label">EVENTS TODAY</p>
            </div>

            <!-- ‼️ STEP 4: Countdown & Tasks -->
            <div class="widget countdown-widget">
                <p class="label">COUNTDOWN</p>
                <div class="event-name">Testing v2.1.9</div>
                <div class="cd-grid">
                    <div class="cd-item"><span class="cd-num">01</span><span class="cd-lbl">DAYS</span></div>
                    <div class="cd-item"><span class="cd-num">01</span><span class="cd-lbl">HRS</span></div>
                </div>
                <button class="action-btn">🔗 Change Event</button>
            </div>

            <div class="widget tasks-widget">
                <div class="task-circle">
                    <span class="task-count">1</span>
                </div>
                <p class="label">UNCOMPLETED TASKS TODAY</p>
            </div>
        </div>

        <!-- ‼️ STEP 5: Reminders & Day Bar (The Scroller from Screenshot) -->
        <div class="widget wide-widget">
            <div class="widget-header">
                <span>🔔 Reminders</span>
                <div class="header-actions">
                    <button class="text-btn">Clear Done</button>
                    <button class="icon-btn">+</button>
                </div>
            </div>
            <!-- This ID is where JS injects the buttons -->
            <div id="reminders-days" class="day-bar"></div>
            <div class="task-list-item">
                <input type="checkbox"> <span>Testing tasks</span>
                <button class="delete-btn">🗑️</button>
            </div>
        </div>

        <!-- ‼️ STEP 6: Google Calendar Section -->
        <div class="widget wide-widget">
            <div class="widget-header">
                <span>📅 Google Calendar</span>
                <button class="action-btn-sm">Sync</button>
            </div>
            <div id="calendar-days" class="day-bar"></div>
        </div>

        <!-- ‼️ STEP 7: Nuke Button -->
        <footer>
            <button class="nuke-btn">🗑️ Clear My Data and Sessions</button>
            <p class="version-stamp">v2.2.0 (Sensei's Release) - 2026.03.22</p>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
