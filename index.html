<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni-Dashboard v1.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --neon-green: #00ff9c; }
        body { background: radial-gradient(circle at top, #1a1a2e, #0f0f1a); color: white; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1.5rem; }
        .neon-text { color: var(--neon-green); text-shadow: 0 0 10px rgba(0, 255, 156, 0.3); }
        .nuke-btn { background: rgba(255, 50, 50, 0.2); border: 1px solid rgba(255, 50, 50, 0.5); }
        input, button { transition: all 0.2s ease; }
        .scroll-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 pb-24">

    <header class="max-w-4xl mx-auto mb-6 flex justify-between items-end">
        <div>
            <h1 id="live-clock" class="text-5xl font-bold neon-text leading-none">00:00:00</h1>
            <p id="live-date" class="text-sm opacity-60 mt-2 neon-text uppercase tracking-widest">Loading Date...</p>
        </div>
        <div class="text-right">
            <div class="flex items-center gap-2 justify-end mb-1">
                <i data-lucide="map-pin" class="w-4 h-4 text-white"></i>
                <input id="city-input" type="text" placeholder="Enter City..." class="bg-transparent border-b border-white/20 outline-none text-right w-32 focus:border-emerald-400">
            </div>
            <p id="current-location" class="text-xs opacity-50">Detecting location...</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        
        <section class="glass p-5 flex flex-col justify-between">
            <div class="flex justify-between items-start mb-4">
                <h3 class="font-bold flex items-center gap-2"><i data-lucide="moon" class="w-4 h-4"></i> Prayers</h3>
                <span id="next-prayer-countdown" class="text-xs font-mono bg-emerald-500/20 px-2 py-1 rounded text-emerald-400">--:--:--</span>
            </div>
            <div id="prayer-list" class="space-y-2 text-sm">
                </div>
        </section>

        <section class="glass p-5">
            <h3 class="font-bold mb-4 flex items-center gap-2"><i data-lucide="activity" class="w-4 h-4"></i> Overview</h3>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white/5 p-3 rounded-xl">
                    <p class="text-[10px] uppercase opacity-50">Mail</p>
                    <p id="mail-count" class="text-xl font-bold neon-text">0</p>
                </div>
                <div class="bg-white/5 p-3 rounded-xl">
                    <p class="text-[10px] uppercase opacity-50">Events</p>
                    <p id="event-count" class="text-xl font-bold neon-text">0</p>
                </div>
            </div>
        </section>

        <section class="glass p-5">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold flex items-center gap-2"><i data-lucide="bitcoin" class="w-4 h-4"></i> Crypto</h3>
                <button onclick="fetchCrypto()" class="hover:rotate-180 transition-transform"><i data-lucide="refresh-cw" class="w-3 h-3"></i></button>
            </div>
            <div id="crypto-list" class="space-y-3">
                </div>
        </section>

        <section class="glass p-5">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold flex items-center gap-2"><i data-lucide="trending-up" class="w-4 h-4"></i> Markets</h3>
                <button onclick="fetchMarkets()" class="hover:rotate-180 transition-transform"><i data-lucide="refresh-cw" class="w-3 h-3"></i></button>
            </div>
            <div id="market-list" class="space-y-3">
                </div>
        </section>

        <section class="glass p-5">
            <h3 class="font-bold mb-3">Tasks</h3>
            <div class="flex gap-2 mb-3">
                <input id="task-input" type="text" class="bg-white/10 rounded-lg px-3 py-1 text-sm flex-1 outline-none focus:ring-1 ring-emerald-400">
                <button onclick="addTask()" class="bg-emerald-500 text-black p-1 px-3 rounded-lg font-bold">+</button>
            </div>
            <div id="task-list" class="space-y-2 h-32 overflow-y-auto scroll-hide"></div>
        </section>

        <section class="glass p-5 flex flex-col justify-center items-center text-center">
            <div id="event-container">
                <p class="text-[10px] uppercase opacity-50 mb-1">Target Event</p>
                <h4 id="event-title" class="font-bold mb-2">No Event Set</h4>
                <p id="event-timer" class="text-2xl font-mono neon-text">00d 00h 00m</p>
                <button onclick="setEventPrompt()" class="mt-3 text-[10px] underline opacity-40 hover:opacity-100">Configure Event</button>
            </div>
        </section>

    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md glass p-4 flex justify-around items-center shadow-2xl">
        <button onclick="toggleSupport()" class="flex flex-col items-center opacity-60 hover:opacity-100">
            <i data-lucide="help-circle" class="w-5 h-5"></i><span class="text-[8px] mt-1 uppercase">Support</span>
        </button>
        <button onclick="window.location.reload()" class="flex flex-col items-center opacity-60 hover:opacity-100">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="text-[8px] mt-1 uppercase">Updates</span>
        </button>
        <button onclick="nukeSystem()" class="flex flex-col items-center text-red-400 hover:text-red-500">
            <i data-lucide="zap" class="w-5 h-5"></i><span class="text-[8px] mt-1 uppercase">Nuke</span>
        </button>
    </nav>

    <div id="support-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-6 z-50 backdrop-blur-md">
        <div class="glass w-full max-w-sm p-6 relative">
            <button onclick="toggleSupport()" class="absolute top-4 right-4"><i data-lucide="x" class="w-4 h-4"></i></button>
            <h2 class="text-xl font-bold mb-4">Support</h2>
            <form action="https://api.web3forms.com/submit" method="POST" class="space-y-4">
                <input type="hidden" name="access_key" value="53bad208-02b2-40b6-974b-98f8b68d0439">
                <input type="text" name="name" placeholder="Name" class="w-full bg-white/5 p-3 rounded-xl outline-none" required>
                <textarea name="message" placeholder="Issue or Feedback" class="w-full bg-white/5 p-3 rounded-xl outline-none h-32" required></textarea>
                <button type="submit" class="w-full bg-emerald-500 text-black font-bold py-3 rounded-xl">Send Report</button>
            </form>
        </div>
    </div>

    <script>
        // ‼️ CONFIGURATION & API KEYS
        const G_ID = '623465337664-jf51sn11crs5bs398inc40al4ksjv1rd.apps.googleusercontent.com';
        const MS_ID = '1155afdf-d585-48cc-af89-b973843ce21a';
        
        // ‼️ STATE MANAGEMENT
        let state = {
            city: localStorage.getItem('city') || 'London',
            lat: 51.5074,
            lon: -0.1278,
            prayers: {},
            tasks: JSON.parse(localStorage.getItem('tasks')) || [],
            event: JSON.parse(localStorage.getItem('event')) || null
        };

        // ‼️ CORE ENGINE
        function init() {
            lucide.createIcons();
            updateClock();
            setInterval(updateClock, 1000);
            
            // Initial Data Fetch
            fetchLocation();
            fetchCrypto();
            fetchMarkets();
            renderTasks();
            renderEvent();
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString([], { hour12: false });
            document.getElementById('live-date').innerText = now.toLocaleDateString('en-GB', { weekday: 'long', day: '2-digit', month: 'short' });
            if (state.prayers.Fajr) updatePrayerCountdown();
            if (state.event) updateEventTimer();
        }

        // 📍 LOCATION & PRAYER
        async function fetchLocation() {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${state.city}`);
            const data = await res.json();
            if (data[0]) {
                state.lat = data[0].lat;
                state.lon = data[0].lon;
                document.getElementById('current-location').innerText = data[0].display_name.split(',')[0];
                fetchPrayers();
            }
        }

        async function fetchPrayers() {
            const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${state.lat}&longitude=${state.lon}&method=2`);
            const data = await res.json();
            state.prayers = data.data.timings;
            renderPrayers();
        }

        function renderPrayers() {
            const list = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
            document.getElementById('prayer-list').innerHTML = list.map(p => `
                <div class="flex justify-between items-center">
                    <span class="opacity-60">${p}</span>
                    <span class="font-mono neon-text">${state.prayers[p]}</span>
                </div>
            `).join('');
        }

        function updatePrayerCountdown() {
            const now = new Date();
            const times = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'].map(p => {
                const [h, m] = state.prayers[p].split(':');
                const d = new Date();
                d.setHours(h, m, 0);
                return { name: p, time: d };
            });

            let next = times.find(t => t.time > now) || { ...times[0], time: new Date(times[0].time.getTime() + 86400000) };
            const diff = next.time - now;
            const h = Math.floor(diff/3600000);
            const m = Math.floor((diff%3600000)/60000);
            const s = Math.floor((diff%60000)/1000);
            document.getElementById('next-prayer-countdown').innerText = `NEXT: ${next.name} · ${h}h ${m}m ${s}s`;
        }

        // 💰 FINANCIALS
        async function fetchCrypto() {
            const coins = ['bitcoin', 'ethereum', 'helium', 'ripple', 'binancecoin', 'magatrump'];
            const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coins.join(',')}&vs_currencies=usd&include_24hr_change=true`);
            const data = await res.json();
            
            const mapping = { bitcoin:'BTC', ethereum:'ETH', helium:'HNT', ripple:'XRP', binancecoin:'BNB', magatrump:'TRUMP' };
            
            document.getElementById('crypto-list').innerHTML = Object.keys(data).map(key => `
                <div class="flex justify-between text-sm">
                    <span class="font-bold">${mapping[key]}</span>
                    <div class="text-right">
                        <p class="neon-text font-mono">$${data[key].usd.toLocaleString()}</p>
                        <p class="text-[9px] ${data[key].usd_24h_change >= 0 ? 'text-emerald-400' : 'text-red-400'}">
                            ${data[key].usd_24h_change.toFixed(2)}%
                        </p>
                    </div>
                </div>
            `).join('');
        }

        async function fetchMarkets() {
            // Forex
            const fxRes = await fetch('https://api.frankfurter.app/latest?from=EUR&to=USD');
            const fxData = await fxRes.json();
            
            // Metals (Simulated/Public Proxy as most require keys, using placeholder logic for demo)
            const metals = { gold: 64.12, silver: 0.78 }; 

            document.getElementById('market-list').innerHTML = `
                <div class="flex justify-between text-sm">
                    <span>EUR/USD</span>
                    <span class="neon-text font-mono">${fxData.rates.USD}</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span>GOLD (g)</span>
                    <span class="neon-text font-mono">$${metals.gold}</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span>SILVER (g)</span>
                    <span class="neon-text font-mono">$${metals.silver}</span>
                </div>
            `;
        }

        // ✅ TASK MANAGEMENT
        function addTask() {
            const input = document.getElementById('task-input');
            if (!input.value) return;
            state.tasks.push({ id: Date.now(), text: input.value });
            input.value = '';
            saveAndRenderTasks();
        }

        function removeTask(id) {
            state.tasks = state.tasks.filter(t => t.id !== id);
            saveAndRenderTasks();
        }

        function saveAndRenderTasks() {
            localStorage.setItem('tasks', JSON.stringify(state.tasks));
            renderTasks();
        }

        function renderTasks() {
            document.getElementById('task-list').innerHTML = state.tasks.map(t => `
                <div class="flex justify-between items-center bg-white/5 p-2 rounded-lg text-xs group">
                    <span>${t.text}</span>
                    <button onclick="removeTask(${t.id})" class="opacity-0 group-hover:opacity-100 text-red-400">×</button>
                </div>
            `).join('');
        }

        // ⏳ EVENT COUNTDOWN
        function setEventPrompt() {
            const name = prompt("Event Name:");
            const date = prompt("Date (YYYY-MM-DD HH:MM):");
            if (name && date) {
                state.event = { name, date: new Date(date).getTime() };
                localStorage.setItem('event', JSON.stringify(state.event));
                renderEvent();
            }
        }

        function renderEvent() {
            if (state.event) {
                document.getElementById('event-title').innerText = state.event.name;
            }
        }

        function updateEventTimer() {
            const diff = state.event.date - new Date().getTime();
            if (diff < 0) {
                document.getElementById('event-timer').innerText = "COMPLETED";
                return;
            }
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            document.getElementById('event-timer').innerText = `${d}d ${h}h ${m}m`;
        }

        // ☢️ UTILS
        function nukeSystem() {
            if (confirm("Erase all data and reset dashboard?")) {
                localStorage.clear();
                window.location.reload();
            }
        }

        function toggleSupport() {
            const el = document.getElementById('support-modal');
            el.classList.toggle('hidden');
            el.classList.toggle('flex');
        }

        document.getElementById('city-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                state.city = e.target.value;
                localStorage.setItem('city', state.city);
                fetchLocation();
            }
        });

        init();
    </script>
</body>
</html>
