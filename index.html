<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Big Minds Dashboard v1.3</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#03030b;--glass:rgba(255,255,255,0.03);--gb:rgba(255,255,255,0.08);--gs:rgba(255,255,255,0.12);--text:#eeeef6;--muted:#5a5a7a;--cyan:#18d8f0;--green:#12e888;--red:#f04060;--amber:#f0a418;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);padding:20px;min-height:100vh;background-image:radial-gradient(circle at 50% 0%,#1a1a3a 0%,#03030b 70%)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:15px;max-width:1400px;margin:0 auto}
.card{background:var(--glass);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid var(--gb);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.card h3{font-family:'Syne';font-size:14px;text-transform:uppercase;letter-spacing:1px;margin-bottom:15px;color:var(--cyan)}
/* ‼️ SECTION 1: COMPONENT STYLES */
.banner{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.led{font-family:'Space Mono';font-size:32px;color:var(--green);text-shadow:0 0 10px var(--green)}
.btn{background:var(--glass);border:1px solid var(--gb);color:var(--text);padding:8px 15px;border-radius:8px;cursor:pointer;font-size:12px;transition:0.2s}
.btn:hover{background:var(--gs)}
.list-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gb);font-size:13px}
#loc-ov{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);display:none;z-index:1000;align-items:center;justify-content:center}
#loc-ov.active{display:flex}
.price-up{color:var(--green)} .price-down{color:var(--red)}
</style>
</head>
<body>

<div class="grid">
    <div class="card banner">
        <div>
            <h1 id="greet" style="font-family:'Syne';font-size:28px">Hello, Leader</h1>
            <p id="loc-display" style="color:var(--muted);font-size:13px">Detecting location...</p>
        </div>
        <div style="text-align:right">
            <div id="main-clock" class="led">00:00:00</div>
            <button class="btn" onclick="showLoc()">Change Location</button>
        </div>
    </div>

    <div class="card">
        <h3>Weather & Forecast</h3>
        <div style="display:flex;align-items:center;gap:15px">
            <span id="wx-icon" style="font-size:40px"></span>
            <div>
                <div id="wx-temp" style="font-size:32px;font-weight:700">--°C</div>
                <div id="wx-desc" style="color:var(--muted)">Fetching...</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>Prayer Times</h3>
        <div id="prayer-list"></div>
    </div>

    <div class="card">
        <h3>Crypto Market</h3>
        <div id="crypto-grid"></div>
    </div>

    <div class="card">
        <h3>Forex & Metals</h3>
        <div id="forex-list"></div>
    </div>

    <div class="card" style="grid-row: span 2">
        <h3>Tasks & Reminders</h3>
        <div id="task-input-zone" style="margin-bottom:15px">
            <input type="text" id="t-in" placeholder="New task..." style="background:none;border:1px solid var(--gb);color:#fff;padding:8px;border-radius:5px;width:70%">
            <button class="btn" onclick="addTask()">Add</button>
        </div>
        <div id="task-list"></div>
    </div>

    <div class="card">
        <h3>Agenda (Google/Outlook)</h3>
        <div id="auth-btns" style="margin-bottom:10px">
            <button class="btn" onclick="gLogin()">G-Cal</button>
            <button class="btn" onclick="oLogin()">Outlook</button>
        </div>
        <div id="event-list" style="font-size:12px"></div>
    </div>

    <div class="card">
        <h3>Global Headlines</h3>
        <div id="news-list" style="font-size:12px;line-height:1.5"></div>
    </div>

    <div class="card">
        <h3>Quote of the Day</h3>
        <p id="q-text" style="font-style:italic;font-size:14px;color:var(--amber)">"Logic is the beginning of wisdom, not the end."</p>
    </div>
</div>

<div id="loc-ov">
    <div class="card" style="width:90%;max-width:400px">
        <h3>Search City</h3>
        <input type="text" id="loc-search" placeholder="Type city..." style="width:100%;padding:10px;background:none;border:1px solid var(--gb);color:#fff">
        <div id="loc-res" style="margin-top:10px;max-height:200px;overflow-y:auto"></div>
        <button class="btn" style="margin-top:15px;width:100%" onclick="showLoc()">Close</button>
    </div>
</div>

<script>
// ‼️ SECTION 8: STATE & CONFIG
var LOC = JSON.parse(localStorage.getItem('dash_loc')) || {city:"London",lat:51.50,lon:-0.12,tz:"Europe/London"};
var TASKS = JSON.parse(localStorage.getItem('dash_tasks')) || [];
var gToken = localStorage.getItem('g_token');

// ‼️ SECTION 9: INITIALIZATION
function init(){
    updateClock();
    fetchWeather();
    fetchPrayers();
    fetchFinance();
    fetchNews();
    renderTasks();
    setInterval(updateClock,1000);
    setInterval(fetchFinance, 300000);
}

// ‼️ SECTION 10: WEATHER LOGIC
async function fetchWeather(){
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LOC.lat}&longitude=${LOC.lon}&current_weather=true`);
    const d = await r.json();
    const cw = d.current_weather;
    document.getElementById('wx-temp').innerText = Math.round(cw.temperature)+'°C';
    document.getElementById('wx-icon').innerText = getWxIcon(cw.weathercode);
    document.getElementById('loc-display').innerText = LOC.city + " • " + LOC.tz;
}

function getWxIcon(c){
    if(c==0)return '☀️'; if(c<4)return '🌤️'; if(c<50)return '☁️';
    if(c<70)return '🌧️'; if(c<80)return '❄️'; return '⛈️';
}

// ‼️ SECTION 11: PRAYER TIMES
async function fetchPrayers(){
    const r = await fetch(`https://api.aladhan.com/v1/timingsByAddress?address=${LOC.city}`);
    const d = await r.json();
    const t = d.data.timings;
    const p = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
    document.getElementById('prayer-list').innerHTML = p.map(n=>`<div class="list-item"><span>${n}</span><span>${t[n]}</span></div>`).join('');
}

// ‼️ SECTION 12: FINANCIAL DATA
async function fetchFinance(){
    try {
        const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,helium&vs_currencies=usd&include_24hr_change=true');
        const d = await r.json();
        const mapping = {bitcoin:'BTC',ethereum:'ETH',solana:'SOL',helium:'HNT'};
        document.getElementById('crypto-grid').innerHTML = Object.keys(mapping).map(k=>`
            <div class="list-item">
                <span>${mapping[k]}</span>
                <span class="${d[k].usd_24h_change >=0 ? 'price-up':'price-down'}">$${d[k].usd.toLocaleString()}</span>
            </div>
        `).join('');
    } catch(e){ console.log("Finance fetch failed"); }
}

// ‼️ SECTION 13: TASK MANAGEMENT
function renderTasks(){
    document.getElementById('task-list').innerHTML = TASKS.map((t,i)=>`
        <div class="list-item">
            <span style="${t.done?'text-decoration:line-through;color:var(--muted)':''}" onclick="toggleTask(${i})">${t.txt}</span>
            <span onclick="delTask(${i})" style="color:var(--red);cursor:pointer">×</span>
        </div>
    `).join('');
}
function addTask(){
    const val = document.getElementById('t-in').value;
    if(!val) return;
    TASKS.push({txt:val, done:false});
    localStorage.setItem('dash_tasks', JSON.stringify(TASKS));
    document.getElementById('t-in').value='';
    renderTasks();
}
function toggleTask(i){ TASKS[i].done = !TASKS[i].done; localStorage.setItem('dash_tasks', JSON.stringify(TASKS)); renderTasks(); }
function delTask(i){ TASKS.splice(i,1); localStorage.setItem('dash_tasks', JSON.stringify(TASKS)); renderTasks(); }

// ‼️ SECTION 14: LOCATION SEARCH
function showLoc(){ document.getElementById('loc-ov').classList.toggle('active'); }
document.getElementById('loc-search').oninput = async (e) => {
    if(e.target.value.length < 3) return;
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${e.target.value}`);
    const d = await r.json();
    document.getElementById('loc-res').innerHTML = (d.results||[]).map(res=>`
        <div class="list-item" style="cursor:pointer" onclick="updateLoc('${res.name}',${res.latitude},${res.longitude},'${res.timezone}')">
            ${res.name}, ${res.country}
        </div>
    `).join('');
};
function updateLoc(name,lat,lon,tz){
    LOC = {city:name, lat, lon, tz};
    localStorage.setItem('dash_loc', JSON.stringify(LOC));
    location.reload();
}

// ‼️ SECTION 15: UTILS
function updateClock(){
    const n = new Date();
    const opt = { timeZone: LOC.tz, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false };
    document.getElementById('main-clock').innerText = new Intl.DateTimeFormat('en-GB', opt).format(n);
}

// ‼️ SECTION 16: NEWS
async function fetchNews(){
    // Using a public RSS to JSON for top headlines
    const r = await fetch('https://api.okotoks.ca/news'); // Example endpoint or similar placeholder
    document.getElementById('news-list').innerHTML = `<div class="list-item">Market updates live...</div><div class="list-item">Global tech trends rising...</div>`;
}

init();
</script>
</body>
</html>
