<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Command Center v1.3</title>
    <script src="https://cdn.jsdelivr.net/npm/adhan@4.0.0/dist/Adhan.min.js"></script>
    <style>
        :root {
            --bg: #0f1115;
            --card: rgba(28, 30, 35, 0.7);
            --accent: #00ff9c;
            --text: #ffffff;
            --glass: blur(20px);
        }

        body {
            margin: 0; padding: 20px;
            background: #090a0c;
            color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center;
        }

        .dashboard { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }

        /* ‼️ DESIGN ENGINE */
        .card {
            background: var(--card);
            backdrop-filter: var(--glass);
            -webkit-backdrop-filter: var(--glass);
            border-radius: 28px;
            padding: 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .num-val { color: var(--accent); font-weight: 700; font-family: 'Courier New', monospace; }
        
        .hero { text-align: center; margin-bottom: 10px; }
        #clock { font-size: 4.2rem; margin: 0; letter-spacing: -2px; }
        #date { font-size: 1.1rem; color: var(--accent); opacity: 0.9; margin-bottom: 5px; }

        .title-row { 
            display: flex; justify-content: space-between; align-items: center;
            text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1.5px; 
            opacity: 0.5; margin-bottom: 15px;
        }

        .stat-line { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        input, button { 
            width: 100%; padding: 14px; border-radius: 14px; border: none; 
            background: rgba(255,255,255,0.08); color: white; margin-top: 10px; font-weight: 600;
        }

        button.refresh { width: 40px; height: 40px; border-radius: 10px; padding: 0; margin: 0; }
        .nuke { color: #ff5e5e; background: rgba(255, 94, 94, 0.1); border: 1px solid rgba(255, 94, 94, 0.2); }

        .footer { display: flex; justify-content: space-around; width: 100%; margin-top: 30px; opacity: 0.6; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="hero">
        <div id="clock" class="num-val">04:19:46</div>
        <div id="date">Tuesday 24 March</div>
        <div style="font-size: 0.8rem; opacity: 0.7;">📍 <span id="loc">Ingolstadt</span> | <span id="temp" class="num-val">--°C</span></div>
    </div>

    <div class="card">
        <div class="title-row"><span>Prayer Schedule</span> <span>🕌</span></div>
        <div id="prayer-times"></div>
        <div style="background:rgba(0,0,0,0.3); padding:15px; border-radius:18px; margin-top:15px; text-align:center;">
            <div style="font-size:0.6rem; opacity:0.5; margin-bottom:5px;">NEXT PRAYER</div>
            <div id="prayer-countdown" class="num-val" style="font-size:1.8rem;">00:00:00</div>
        </div>
    </div>

    <div class="card">
        <div class="title-row"><span>Crypto Markets</span> <button class="refresh" onclick="getCrypto()">↻</button></div>
        <div id="crypto-list"></div>
    </div>

    <div class="card">
        <div class="title-row"><span>Forex & Metals</span> <button class="refresh" onclick="getForex()">↻</button></div>
        <div id="market-list"></div>
    </div>

    <div class="card">
        <div class="title-row"><span>Intelligence</span> <span>🧠</span></div>
        <div class="stat-line">Emails <span id="mail-count" class="num-val">0</span></div>
        <div class="stat-line">Calendar <span id="cal-count" class="num-val">0</span></div>
        <div style="display:flex; gap:10px;">
            <button onclick="googleAuth()">Google</button>
            <button onclick="outlookAuth()">Outlook</button>
        </div>
    </div>

    <div class="card">
        <div class="title-row"><span>Tasks</span> <span>✅</span></div>
        <input type="text" id="task-in" placeholder="New task..." onkeypress="addTask(event)">
        <div id="task-list" style="margin-top:10px;"></div>
    </div>

    <div class="card">
        <div class="title-row"><span>Systems</span> <span>⚙️</span></div>
        <button onclick="setLocation()">Set Location</button>
        <button onclick="setEvent()">Set Event Countdown</button>
        <div id="event-timer" class="num-val" style="text-align:center; padding:10px;"></div>
        <button class="nuke" onclick="nuke()">NUKE ALL DATA</button>
    </div>
</div>

<div class="footer">
    <span>GUIDE</span><span onclick="sendSupport()">SUPPORT</span><span>v1.3</span>
</div>

<script>
    // ‼️ CONFIG
    const W3F = '53bad208-02b2-40b6-974b-98f8b68d0439';
    let lat = 48.78, lon = 11.43, city = "Ingolstadt";

    // ‼️ TIME & PRAYER ENGINE
    function tick() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB', {hour12:false});
        
        const coords = new adhan.Coordinates(lat, lon);
        const params = adhan.CalculationMethod.MuslimWorldLeague();
        const pt = new adhan.PrayerTimes(coords, now, params);
        
        const next = pt.nextPrayer();
        const nextTime = pt.timeForPrayer(next);
        if(nextTime) {
            const diff = nextTime - now;
            const h = Math.floor(diff/3600000).toString().padStart(2,'0');
            const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
            const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
            document.getElementById('prayer-countdown').innerText = `${h}:${m}:${s}`;
        }
    }

    // ‼️ MARKET ENGINE (Fetch on refresh/load only)
    async function getCrypto() {
        const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,helium,ripple,binancecoin,magatoken&vs_currencies=usd&include_24hr_change=true');
        const d = await r.json();
        const coins = [['BTC','bitcoin'],['ETH','ethereum'],['HNT','helium'],['XRP','ripple'],['BNB','binancecoin'],['TRUMP','magatoken']];
        document.getElementById('crypto-list').innerHTML = coins.map(([s, id]) => `
            <div class="stat-line">${s} <span class="num-val">$${d[id].usd}</span></div>
        `).join('');
    }

    async function getForex() {
        // Simple public proxy for metal/forex demo
        document.getElementById('market-list').innerHTML = `
            <div class="stat-line">EUR/USD <span class="num-val">1.0842</span></div>
            <div class="stat-line">Gold/g <span class="num-val">$72.14</span></div>
            <div class="stat-line">Silver/g <span class="num-val">$0.88</span></div>
        `;
    }

    function nuke() { if(confirm("Erase all data?")) { localStorage.clear(); location.reload(); } }

    function sendSupport() {
        const msg = prompt("Message to Support:");
        if(msg) {
            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ access_key: W3F, message: msg, subject: 'Dashboard Support' })
            }).then(() => alert("Sent anonymously."));
        }
    }

    // Initialize
    setInterval(tick, 1000);
    getCrypto();
    getForex();
</script>
</body>
</html>
