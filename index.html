<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login Flow</title>
    <style>
        :root {
            --primary: #007bff;
            --error: #dc3545;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* ‼️ STEP 1: Card Container and Transitions */
        .card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        .card.active { display: block; }

        h2 { color: #333; margin-bottom: 0.5rem; }
        p { color: #666; margin-bottom: 1.5rem; }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #eee;
            border-radius: 10px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus { border-color: var(--primary); outline: none; }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        /* ‼️ STEP 2: The Hidden Input & PIN Dots UI */
        .pin-wrapper { position: relative; margin: 20px 0; }
        
        .hidden-pin-input {
            position: absolute;
            opacity: 0;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: default;
        }

        .dots-container {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .dot {
            width: 18px;
            height: 18px;
            border: 2px solid #ddd;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .dot.filled {
            background-color: var(--primary);
            border-color: var(--primary);
            transform: scale(1.1);
        }

        .error-msg {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 10px;
            min-height: 1.2rem;
        }

        .success-check {
            font-size: 4rem;
            color: #28a745;
            margin-bottom: 1rem;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

    <div class="card active" id="step1">
        <h2>Welcome Back</h2>
        <p>Please verify your identity</p>
        <input type="text" id="user1" placeholder="Enter Username" autocomplete="off">
        <input type="text" id="user2" placeholder="Confirm Username" autocomplete="off">
        <div id="user-error" class="error-msg"></div>
        <button onclick="checkUsernames()">Continue →</button>
    </div>

    <div class="card" id="step2">
        <h2>Create Your PIN</h2>
        <p>Enter a 6-digit PIN</p>
        <div class="pin-wrapper">
            <input type="tel" id="pinInput1" class="hidden-pin-input" maxlength="6" inputmode="numeric">
            <div class="dots-container" id="dots1">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div>
    </div>

    <div class="card" id="step3">
        <h2>Please Confirm PIN</h2>
        <p>Re-enter your 6-digit PIN</p>
        <div class="pin-wrapper">
            <input type="tel" id="pinInput2" class="hidden-pin-input" maxlength="6" inputmode="numeric">
            <div class="dots-container" id="dots2">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div>
        <div id="pin-error" class="error-msg"></div>
    </div>

    <div class="card" id="step4">
        <div class="success-check">✅</div>
        <h2>Success!</h2>
        <p>Your PIN has been set.<br>Signing you in...</p>
    </div>

    <script>
        let createdPin = "";

        function showCard(cardId) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            const next = document.getElementById(cardId);
            next.classList.add('active');
            
            // Auto-focus the hidden input for PIN cards
            const input = next.querySelector('.hidden-pin-input');
            if(input) input.focus();
        }

        function checkUsernames() {
            const u1 = document.getElementById('user1').value;
            const u2 = document.getElementById('user2').value;
            const err = document.getElementById('user-error');

            if (u1 && u1 === u2) {
                err.innerText = "";
                showCard('step2');
            } else {
                err.innerText = "Usernames do not match";
                document.getElementById('step1').classList.add('shake');
                setTimeout(() => document.getElementById('step1').classList.remove('shake'), 400);
            }
        }

        // ‼️ STEP 4: PIN Input Listener Logic
        function setupPinListener(inputId, dotsId, onComplete) {
            const input = document.getElementById(inputId);
            const dots = document.getElementById(dotsId).children;

            input.addEventListener('input', (e) => {
                const val = e.target.value;
                
                // Update dots
                for (let i = 0; i < dots.length; i++) {
                    dots[i].classList.toggle('filled', i < val.length);
                }

                // Auto-submit logic
                if (val.length === 6) {
                    onComplete(val);
                }
            });
        }

        setupPinListener('pinInput1', 'dots1', (val) => {
            createdPin = val;
            showCard('step3');
        });

        setupPinListener('pinInput2', 'dots2', (val) => {
            if (val === createdPin) {
                showCard('step4');
                // ‼️ FINAL STEP: Automatic Login simulation
                setTimeout(() => {
                    window.location.href = "/dashboard"; // Change this to your actual destination
                }, 2000);
            } else {
                const err = document.getElementById('pin-error');
                err.innerText = "PINs do not match. Restarting...";
                document.getElementById('step3').classList.add('shake');
                
                // Reset step 3
                setTimeout(() => {
                    document.getElementById('step3').classList.remove('shake');
                    document.getElementById('pinInput2').value = "";
                    Array.from(document.getElementById('dots2').children).forEach(d => d.classList.remove('filled'));
                    showCard('step2'); // Send back to step 2 to try again
                    document.getElementById('pinInput1').value = "";
                    Array.from(document.getElementById('dots1').children).forEach(d => d.classList.remove('filled'));
                }, 1000);
            }
        });
    </script>
</body>
</html>
