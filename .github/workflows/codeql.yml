
name: "CodeQL"
on:
  push:
    branches: [ "main" ]
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Init CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: 'javascript'
      - name: Analyze
        uses: github/codeql-action/analyze@v2
